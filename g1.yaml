policy: "policy_lstm_1_20000.pt"
policy_path: "{WORKING_DIR}/policy/{POLICY}"
xml_path: "{WORKING_DIR}/model/scene.xml"
log_on: true # boolean for allowing trajectory collecting or not
render: true # boolean for allowing visualization or not
# Total simulation time
simulation_duration: 10.0
# Simulation time step
simulation_dt: 0.002
# Controller update frequency (meets the requirement of simulation_dt * controll_decimation=0.02; 50Hz)
control_decimation: 10
kps: [100, 100, 100, 150, 40, 40, 100, 100, 100, 150, 40, 40]
kds: [2, 2, 2, 4, 2, 2, 2, 2, 2, 4, 2, 2]
default_angles: [-0.1, 0.0, 0.0, 0.3, -0.2, 0.0, -0.1, 0.0, 0.0, 0.3, -0.2, 0.0]
ang_vel_scale: 0.25
dof_pos_scale: 1.0
dof_vel_scale: 0.05
action_scale: 0.25
cmd_scale: [2.0, 2.0, 0.25]
num_actions: 12
num_obs: 47
cmd_init: [0.01, 0, 0]
